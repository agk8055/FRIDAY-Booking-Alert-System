services:
  - type: web
    name: friday-booking-alert
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: HEADLESS_BROWSER
        value: "false"
      - key: USE_CURL_CFFI
        value: "true"
      - key: CURL_IMPERSONATE
        value: "chrome152"
      - key: PROXY_URL
        sync: false
      - key: RECYCLE_BROWSER_CYCLES
        value: "10"
      - key: CHECK_INTERVAL_SECONDS
        value: "120"
      - key: SOUND_ALERT
        value: "false"
      - key: WINDOWS_TOAST
        value: "false"
      - key: OPEN_BROWSER_ON_OPEN
        value: "false"
      - key: DASHBOARD_USERNAME
        value: "admin"
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DISCORD_ENABLED
        value: "false"
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: EMAIL_ENABLED
        value: "true"
      - key: SMTP_SERVER
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_RECIPIENT
        sync: false
      - key: WEBHOOK_ENABLED
        value: "false"
      - key: WEBHOOK_URL
        sync: false
